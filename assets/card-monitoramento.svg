<svg xmlns="http://www.w3.org/2000/svg" width="500" height="280" viewBox="0 0 500 280" role="img" aria-label="Monitoramento de OLTs. Painel no Grafana com os dados do Zabbix para acompanhar as OLTs do provedor, mais um alerta de OS duplicada de reparo de CTO vinda do IXC. Tecnologias: Zabbix, Grafana, JavaScript, IXC.">
<style>
  .sans{font-family:'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace}
  .in{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .led{animation:led 2.4s ease-in-out infinite}
  @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
  .pulse{animation:pulse 4.5s cubic-bezier(.215,.61,.355,1) infinite}
  @keyframes pulse{from{stroke-dashoffset:.16}to{stroke-dashoffset:-1}}
  @media (prefers-reduced-motion:reduce){.in,.blink,.led,.pulse,.ch{animation:none}.moving{display:none}}
    .dot{animation:hop 1.2s cubic-bezier(.215,.61,.355,1) infinite}@keyframes hop{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-5px);opacity:1}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:bar 2.6s ease-in-out infinite}
    @keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.dot,.bar{animation:none}}</style>
