<circle cx="23" cy="20" r="4" fill="#ffb547" class="dot" style="animation-delay:0s"/><circle cx="37" cy="20" r="4" fill="#ffb547" class="dot" style="animation-delay:0.15s"/><circle cx="51" cy="20" r="4" fill="#ffb547" class="dot" style="animation-delay:0.3s"/></g>
<text x="28" y="100" class="sans in" font-size="26" font-weight="700" fill="#e8eef7">Agente de IA para o suporte</text>
