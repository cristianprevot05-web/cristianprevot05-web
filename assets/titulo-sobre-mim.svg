<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="60" viewBox="0 0 1000 60" role="img" aria-label="sobre mim">
<style>
  .sans{font-family:'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace}
  .in{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .led{animation:led 2.4s ease-in-out infinite}
  @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
  .pulse{animation:pulse 4.5s cubic-bezier(.215,.61,.355,1) infinite}
  @keyframes pulse{from{stroke-dashoffset:.16}to{stroke-dashoffset:-1}}
  @media (prefers-reduced-motion:reduce){.in,.blink,.led,.pulse,.ch{animation:none}.moving{display:none}}.pulse{animation-duration:5s}</style>
<defs><linearGradient id="f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b3354"/><stop offset="1" stop-color="#1b3354" stop-opacity="0"/></linearGradient></defs>
<rect x=".5" y=".5" width="999" height="59" rx="12" fill="#0a1628" stroke="#1b3354"/>
<rect x="20" y="17" width="4" height="26" rx="2" fill="#3ee0a1"/>
<circle cx="22" cy="30" r="9" fill="#3ee0a1" fill-opacity=".18" class="led"/>
<text x="40" y="38" class="sans in" font-size="22" font-weight="600" fill="#e8eef7">sobre mim</text>
<path d="M171.8 30H930" stroke="url(#f)" stroke-dasharray="2 5"/>
<path d="M171.8 30H930" pathLength="1" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-dasharray=".16 1" class="pulse" style="animation-delay:0.6s"/>
<text x="978" y="35" class="mono" font-size="13" fill="#5d7393" text-anchor="end">01</text>
</svg>
